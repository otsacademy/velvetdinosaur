# Dedicated activity log for Velvet Dinosaur subdomains. The monitor resolves
# the authoritative demo inventory dynamically, so non-demo subdomains are
# ignored and newly stamped demos are covered without changing nginx again.
map $host $vd_demo_activity_loggable {
    default 0;
    ~^[a-z0-9-]+\.velvetdinosaur\.com$ 1;
}

log_format vd_demo_activity escape=json
    '{"host":"$host","ip":"$remote_addr","time":"$time_iso8601",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"referer":"$http_referer","userAgent":"$http_user_agent"}';

access_log /var/log/nginx/vd-demo-activity.log vd_demo_activity if=$vd_demo_activity_loggable;
