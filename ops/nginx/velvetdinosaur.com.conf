map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $cors_origin {
    default "";
    ~*^https://([a-z0-9-]+\.)*velvetdinosaur\.com$ $http_origin;
}

server {
    server_name velvetdinosaur.com www.velvetdinosaur.com;

    location = /__admin_auth {
        internal;
        rewrite ^ /api/auth/grafana break;
        include /etc/nginx/snippets/velvetdinosaur-active-upstream.conf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host velvetdinosaur.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location = /admin/alertmanager {
        return 301 /admin/alertmanager/;
    }

    location ^~ /admin/alertmanager/ {
        auth_request /__admin_auth;
        error_page 401 = @admin_auth_redirect;
        error_page 403 = @admin_forbidden;

        rewrite ^/admin/alertmanager/(.*)$ /alertmanager/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /admin/alertmanager;
        proxy_pass http://127.0.0.1:9093;
    }

    location @admin_auth_redirect {
        return 302 https://velvetdinosaur.com/sign-in?next=/admin/alertmanager/;
    }

    location @admin_forbidden {
        return 403;
    }

    location ^~ /api/auth/ {
        limit_req zone=vd_auth burst=10 nodelay;
        limit_conn vd_conn 20;
        # Allow cross-origin auth from approved subdomains
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Vary' 'Origin' always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Vary' 'Origin' always;

        include /etc/nginx/snippets/velvetdinosaur-active-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /api/ {
        limit_req zone=vd_api burst=40 nodelay;
        limit_conn vd_conn 20;
        include /etc/nginx/snippets/velvetdinosaur-active-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        include /etc/nginx/snippets/velvetdinosaur-active-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/velvetdinosaur.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/velvetdinosaur.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.velvetdinosaur.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = velvetdinosaur.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name velvetdinosaur.com www.velvetdinosaur.com;
    return 404; # managed by Certbot




}
