<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/msttcorefonts/*</glob>
      <glob>/usr/share/fonts/truetype/libreoffice/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
